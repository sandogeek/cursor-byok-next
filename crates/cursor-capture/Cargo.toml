[package]
name = "cursor-capture"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Capture and inspect Cursor API traffic with the original debug UI"

[lints]
workspace = true

[[bin]]
name = "cursor-capture"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "http2"] }
brotli = "8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "7"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
mime = "0.3"
mime_guess = "2"
open = "5"
parking_lot = "0.12"
pin-project-lite = "0.2"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
url = "2"

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
protox = "0.9"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
