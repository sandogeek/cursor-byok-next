[package]
name = "cursor-protocol-extractor"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Extract Cursor local-loop protobuf schemas from installed JS bundles"

[lints]
workspace = true

[[bin]]
name = "cursor-protocol-extractor"
path = "src/main.rs"

[dependencies]
oxc = { version = "0.159", features = ["ast_visit"] }
regex = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
