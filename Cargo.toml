[workspace]
members = ["apps/desktop", "crates/cursor-protocol-extractor", "crates/cursor-capture"]
resolver = "3"

[workspace.package]
# nsh-core / nsh-base 0.6 need 1.97.
rust-version = "1.97"

# BeautifulRust drop-in lints: https://github.com/morganlinton/BeautifulRust
# Enforce strictly in CI with:
#   cargo clippy --workspace --all-targets --all-features -- -D warnings
# Silence a lint locally with a reason:
#   #[expect(clippy::unwrap_used, reason = "the regex is a literal and always compiles")]
#
# All three members are applications (the desktop app plus two CLI tools), so the
# lints BeautifulRust marks "[lib]" are dropped: missing_docs, missing_panics_doc,
# missing_errors_doc, unreachable_pub, exhaustive_enums. Restore them if a crate
# here ever ships as a library. print_stdout / print_stderr stay on: the CLI entry
# points opt out with a documented `#![expect(...)]`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Groups first, at lower priority so the individual settings below win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panics: return errors, and give every intentional panic a reason.
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"

# Suppressions must explain themselves and expire when no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Unsafe must be justified.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

# API shape.
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

# Idioms.
string_add = "warn"
wildcard_imports = "warn"

# Output and debugging leftovers.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Casts that silently lose information.
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Pedantic lints that are mostly noise in practice, or that the skill disagrees with.
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

# BeautifulRust "[lib]" lints reached through the pedantic group; dropped for
# application crates (see the comment above [workspace.lints.rust]).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
exhaustive_enums = "allow"
