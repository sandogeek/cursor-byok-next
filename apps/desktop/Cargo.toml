[package]
name = "nsh-app-cursor-byok-next"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
futures-util = "0.3"
hex = "0.4"
hudsucker = { version = "0.25", features = ["http2"] }
json5 = "0.4"
nsh-core = "0.6.0"
# `nsh-base` has no hand-written caller in this crate, but every generated
# platform entry under `.nsh/rust/` calls `nsh_base::registry()`, so removing it
# breaks `nsh run`/`nsh package` on every target.
nsh-base = "0.6.0"
parking_lot = "0.12"
pem = "3"
prost = "0.14"
prost-types = "0.14"
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["decompression-gzip"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAppearance", "NSApplication", "NSResponder", "NSRunningApplication"] }
# Only `harness::ca`'s macOS trust check fingerprints the CA with SHA-1, which is
# what `security find-certificate` prints.
sha1 = "0.10"
