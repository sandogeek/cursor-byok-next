[package]
name = "nsh-app-cursor-byok"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
dirs = "6"
hex = "0.4"
hudsucker = { version = "0.25", features = ["http2"] }
json5 = "0.4"
nsh-core = "0.5.0"
nsh-base = "0.5.0"
parking_lot = "0.12"
pem = "3"
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem", "x509-parser"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }