      enabled: Cursor 正在通过本地代理连接。模型配置将在后续接入。
      disabled: 开启右上角接管开关后，Cursor 才会使用本地代理。
      degraded: 本地代理与 Cursor 配置不一致，请刷新状态或重新开启接管。
  dialog:
    disable:
      title: 关闭接管 Cursor？
      body: 关闭后将移除本应用写入的 Cursor 本地代理配置，其他代理设置不受影响。
