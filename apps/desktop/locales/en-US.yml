takeover:
  status:
    enabled: Taking over
    disabled: Not taking over
    degraded: Degraded
  switch:
    enable: Take over Cursor
    disable: Stop taking over Cursor
  error:
    status: Could not read takeover state
    copy: "Copy failed: %{message}"
  ca:
    missing:
      title: Initialize the local CA first
      body: The CA stays on this Mac and lets the app read Cursor's HTTPS traffic safely.
    initialize: Initialize CA
    untrusted:
      title: Trust the local CA in the system
      body: Copy the command, run it in a terminal, enter your password, then refresh.
    install: Install local CA…
    refresh: Refresh
    invalid:
      title: The local CA is invalid
      body: The certificate or key is incomplete, mismatched, or expired. Check the CA files before initializing again.
    recheck: Check again
  ready:
    enabled: Cursor takeover is active
    disabled: The local CA is ready
    body:
      enabled: Cursor is connecting through the local proxy. Model settings come next.
      disabled: Turn on takeover in the top right before Cursor uses the local proxy.
      degraded: The proxy and Cursor's settings disagree. Refresh, or turn takeover off and on again.
  dialog:
    disable:
      title: Stop taking over Cursor?
      body: This removes the proxy settings this app wrote. Other proxy settings stay as they are.
      confirm: Stop takeover
    ca:
      title: Install the local CA
      body: Trusting the certificate needs an administrator password. The app only copies the command; it never runs it.
      confirm: Copy command
      hint: Paste the command into a terminal, then come back and refresh this page.
      copied: Command copied

